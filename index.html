<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LARS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #t {
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 12px;
    background: #0a0a0a;
    color: #c0c0c0;
    width: 640px;
    min-height: 480px;
    display: flex;
    flex-direction: column;
    padding: 28px 28px 0;
  }
  #screen {
    flex: 1;
    overflow-y: auto;
    max-height: 400px;
    min-height: 300px;
    display: flex;
    flex-direction: column;
    scrollbar-width: thin;
    scrollbar-color: #1e1e1e #0a0a0a;
  }
  #screen::-webkit-scrollbar { width: 3px; }
  #screen::-webkit-scrollbar-track { background: #0a0a0a; }
  #screen::-webkit-scrollbar-thumb { background: #1e1e1e; }
  .line {
    display: flex;
    gap: 9px;
    padding: 2px 0;
    line-height: 1.8;
    align-items: flex-start;
    font-size: 12px;
  }
  .p-lars { color: #c0392b; white-space: nowrap; flex-shrink: 0; }
  .p-user { color: #3a3a3a; white-space: nowrap; flex-shrink: 0; }
  .t-lars { color: #dedede; }
  .t-user { color: #4a4a4a; }
  .t-sys  { color: #1e1e1e; }
  #cursor {
    display: inline-block;
    width: 7px;
    height: 12px;
    background: #c0392b;
    vertical-align: middle;
    margin-left: 1px;
    animation: blink 1.1s step-end infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  #input-row {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 12px 0 0;
    border-top: 1px solid #c0392b22;
    margin-top: 8px;
  }
  #input-prompt { color: #c0392b; font-size: 12px; white-space: nowrap; flex-shrink: 0; }
  #user-input {
    background: transparent;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 12px;
    color: #c0c0c0;
    flex: 1;
    caret-color: #c0392b;
  }
  #user-input::placeholder { color: #2a2a2a; }
  #hint {
    font-size: 10px;
    color: #2a2a2a;
    letter-spacing: 0.06em;
    padding: 3px 0 8px;
    padding-left: calc(9px + 3.5ch + 9px);
    opacity: 0;
    transition: opacity 0.3s;
  }
  #statusline {
    padding: 8px 0 20px;
    display: flex;
    justify-content: space-between;
  }
  #status-l { font-size: 10px; color: #c0392b; letter-spacing: 0.1em; text-transform: uppercase; }
  #status-r { font-size: 10px; color: #1e1e1e; letter-spacing: 0.06em; }

  @media (max-width: 680px) {
    #t { width: 100vw; min-height: 100dvh; padding: 20px 16px 0; }
    #screen { max-height: calc(100dvh - 120px); }
  }
</style>
</head>
<body>

<div id="t">
  <div id="screen">
    <div class="line"><span class="p-lars">LARS:~$</span><span class="t-sys">boot sequence complete.</span></div>
    <div class="line"><span class="p-lars">LARS:~$</span><span class="t-lars">what.<span id="cursor"></span></span></div>
  </div>
  <div id="input-row">
    <span id="input-prompt">you:~$</span>
    <input id="user-input" type="text" placeholder="type here" autocomplete="off" spellcheck="false" />
  </div>
  <div id="hint">↵ enter</div>
  <div id="statusline">
    <span id="status-l">ready</span>
    <span id="status-r">ERD · dimes square · vaping</span>
  </div>
</div>

<script>
const history = [];
const screen = document.getElementById('screen');
const input = document.getElementById('user-input');
const statusL = document.getElementById('status-l');
const hint = document.getElementById('hint');

input.addEventListener('focus', () => hint.style.opacity = '1');
input.addEventListener('blur', () => hint.style.opacity = '0');

function removeCursor() { const c = document.getElementById('cursor'); if (c) c.remove(); }

function addLine(pp, pc, text, tc) {
  removeCursor();
  const line = document.createElement('div');
  line.className = 'line';
  const p = document.createElement('span'); p.className = pc; p.textContent = pp;
  const t = document.createElement('span'); t.className = tc; t.textContent = text;
  line.appendChild(p); line.appendChild(t);
  screen.appendChild(line);
  screen.scrollTop = screen.scrollHeight;
  return t;
}

function addCursor(el) { const c = document.createElement('span'); c.id = 'cursor'; el.appendChild(c); }

async function send() {
  const text = input.value.trim();
  if (!text || input.disabled) return;
  input.value = '';
  input.disabled = true;
  hint.style.opacity = '0';
  addLine('you:~$', 'p-user', text, 't-user');
  history.push({ role: 'user', content: text });
  const thinking = addLine('LARS:~$', 'p-lars', '_', 't-lars');
  statusL.textContent = 'thinking';
  try {
    const res = await fetch('/.netlify/functions/lars', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });
    const data = await res.json();
    const reply = data.content?.[0]?.text || '...';
    thinking.textContent = reply;
    addCursor(thinking);
    history.push({ role: 'assistant', content: reply });
    statusL.textContent = 'ready';
  } catch(e) {
    thinking.textContent = 'something broke. figures.';
    statusL.textContent = 'error';
  }
  input.disabled = false;
  input.focus();
  screen.scrollTop = screen.scrollHeight;
}

input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
input.focus();
</script>

</body>
</html>
